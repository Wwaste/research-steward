name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  source-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/research-steward
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: plugins/research-steward/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm audit --audit-level=moderate
  distribution:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/research-steward
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: plugins/research-steward/package-lock.json
      - run: npm ci
      - name: rebuild-bundles
        run: npm run build
      - name: bundle-identity
        run: git diff --exit-code -- dist schemas
      - name: no-untracked-bundles
        run: test -z "$(git status --porcelain -- dist schemas)"
      - name: installed-smoke
        run: node scripts/smoke-installed-plugin.mjs
      - run: node scripts/smoke-client-roots.mjs
      - run: node scripts/smoke-mcp.mjs
      - run: node scripts/smoke-http.mjs
